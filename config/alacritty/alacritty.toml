[general]
import = [
  "~/.config/alacritty/catppuccin-macchiato.toml"
]

[bell]
animation = "EaseOutExpo"

[cursor]
blink_interval = 800
unfocused_hollow = true

[cursor.style]
blinking = "On"
shape = "Beam"

[env]
TERM = "xterm-256color"

[font]
size = 13.5

[font.bold]
family = "Ioskeley Mono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Ioskeley Mono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Ioskeley Mono Nerd Font"
style = "Italic"

[font.normal]
family = "Ioskeley Mono Nerd Font"
style = "Regular"

[scrolling]
history = 100000

[window]
decorations = "none"
opacity = 0.8
