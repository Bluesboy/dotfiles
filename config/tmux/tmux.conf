# Clear screan with <C-l>
bind C-l send-keys 'C-l'

# Enable extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# Automatically renumber windows
set -g renumber-windows on

# Set history limit
set-option -g history-limit 100000

# 256 color terminal
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',*-256color:RGB'
# wezterm reports TERM=wezterm, which matches neither the override above nor the
# built-in xterm* feature set, so its capabilities have to be spelled out or
# truecolor, focus events and cursor styling regress without any error.
# usstyle adds undercurl; extkeys pairs with the extended-keys option above.
set-option -sa terminal-features ',wezterm:RGB:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:osc7:overline:strikethrough:sync:title:usstyle'
set-option -sg escape-time 10

set -g base-index 1
setw -g pane-base-index 1

setw -g mode-keys vi

# Enable mouse scroll
setw -g mouse on

# Quick reload tmux config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"
bind-key M split-window -h "vim ~/.config/tmux/tmux.conf"

# Remap prefix key to 'C-space'
unbind C-b
set -g prefix C-Space
bind Space send-prefix

set-option -g focus-events on

# Load SSH_AUTH_SOCK for each pane
# set -g update-environment -r
set-environment -g 'SSH_AUTH_SOCK' ~/.ssh/ssh_auth_sock

# The server keeps the environment of the pane that started it for its whole
# life, so WEZTERM_UNIX_SOCKET goes stale the moment that wezterm window closes.
# Anything spawned later -- nvim calling wezterm cli through smart-splits, most
# of all -- then talks to a socket with no GUI behind it. Refreshing these on
# attach keeps new panes pointed at the wezterm that is actually running.
# pane-nav.sh does not rely on this: run-shell reads the server environment
# rather than the session one, so it resolves the values from the client itself.
set -ga update-environment 'WEZTERM_PANE'
set -ga update-environment 'WEZTERM_UNIX_SOCKET'

# VIM like copy-paste
# X11-like selection semantics: mouse drag goes to PRIMARY, y goes to CLIPBOARD,
# middle click pastes from PRIMARY.
set -g set-clipboard on
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
# Selection stays highlighted after the mouse is released; a plain click
# dismisses it, middle click pastes from PRIMARY (X11-like).
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy --primary"
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X cancel
bind-key -T copy-mode-vi MouseDown2Pane send-keys -X cancel \; run-shell "wl-paste --primary --no-newline | tmux load-buffer - ; tmux paste-buffer -p"
bind-key -n MouseDown2Pane run-shell "wl-paste --primary --no-newline | tmux load-buffer - ; tmux paste-buffer -p"

# Double click selects a word, triple click selects a line; both copy to PRIMARY.
bind-key -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "wl-copy --primary"
bind-key -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "wl-copy --primary"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "wl-copy --primary"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "wl-copy --primary"

# VIM like pane switch
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Switch between windows with <TAB>
bind-key -r Tab next-window
bind-key -r BTab previous-window

#Zoom current window
bind-key -n 'M-o' resize-pane -Z 

#Move window
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1


# List of plugins
set -g @plugin 'Ataraxy-Labs/opensessions'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'datamadsen/nunchux'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

### Plugin options
# Smart Splits
set -g @plugin 'mrjones2014/smart-splits.nvim'

# Optional configurations with their default values if omitted:

set -g @smart-splits_no_wrap '' # to disable wrapping. (any value disables wrapping)

set -g @smart-splits_move_left_key  'C-h' # key-mapping for navigation.
set -g @smart-splits_move_down_key  'C-j' #  --"--
set -g @smart-splits_move_up_key    'C-k' #  --"--
set -g @smart-splits_move_right_key 'C-l' #  --"--

set -g @smart-splits_resize_left_key  'M-h' # key-mapping for resizing.
set -g @smart-splits_resize_down_key  'M-j' #  --"--
set -g @smart-splits_resize_up_key    'M-k' #  --"--
set -g @smart-splits_resize_right_key 'M-l' #  --"--

set -g @smart-splits_resize_step_size '1' # change the step-size for resizing.

# Catppuccin
set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "none"

# fzf-url history
set -g @fzf-url-history-limit '2000'

# Nunchux
set -g @nunchux-key 'g'

run '/usr/share/tmux-plugin-manager/tpm'

### Smart Splits: escalate to wezterm at the tmux edge
# Overrides the move bindings installed by the smart-splits TPM plugin, so this
# must stay after the tpm call above. Order of checks per key:
#   1. pane runs nvim (@pane-is-vim, set by smart-splits.nvim) -> forward the key
#   2. tmux pane is at that edge                               -> pane-nav.sh
#   3. otherwise                                               -> move inside tmux
# nvim reaches pane-nav.sh too, through its smart-splits at_edge hook, so the
# ring is described in one place. The client pid goes in because run-shell
# cannot be trusted for it: it inherits the server environment, whose
# WEZTERM_UNIX_SOCKET names whichever wezterm started the server, usually dead.
# The script exits 3 when nothing took the move, which only nvim acts on.
bind-key -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { if -F '#{&&:#{pane_at_left},#{==:#{window_zoomed_flag},0}}'   { run-shell '~/.config/tmux/pane-nav.sh Left #{client_pid} || true'}  { select-pane -L } }
bind-key -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { if -F '#{&&:#{pane_at_bottom},#{==:#{window_zoomed_flag},0}}' { run-shell '~/.config/tmux/pane-nav.sh Down #{client_pid} || true'}  { select-pane -D } }
bind-key -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { if -F '#{&&:#{pane_at_top},#{==:#{window_zoomed_flag},0}}'    { run-shell '~/.config/tmux/pane-nav.sh Up #{client_pid} || true'}    { select-pane -U } }
bind-key -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { if -F '#{&&:#{pane_at_right},#{==:#{window_zoomed_flag},0}}'  { run-shell '~/.config/tmux/pane-nav.sh Right #{client_pid} || true'} { select-pane -R } }

bind-key -T copy-mode-vi C-h if -F '#{&&:#{pane_at_left},#{==:#{window_zoomed_flag},0}}'   { run-shell '~/.config/tmux/pane-nav.sh Left #{client_pid} || true'}  { select-pane -L }
bind-key -T copy-mode-vi C-j if -F '#{&&:#{pane_at_bottom},#{==:#{window_zoomed_flag},0}}' { run-shell '~/.config/tmux/pane-nav.sh Down #{client_pid} || true'}  { select-pane -D }
bind-key -T copy-mode-vi C-k if -F '#{&&:#{pane_at_top},#{==:#{window_zoomed_flag},0}}'    { run-shell '~/.config/tmux/pane-nav.sh Up #{client_pid} || true'}    { select-pane -U }
bind-key -T copy-mode-vi C-l if -F '#{&&:#{pane_at_right},#{==:#{window_zoomed_flag},0}}'  { run-shell '~/.config/tmux/pane-nav.sh Right #{client_pid} || true'} { select-pane -R }

# lazy-tmux
run-shell -b 'lazy-tmux daemon --interval 3m --scrollback >/tmp/lazy-tmux.log 2>&1 || tmux display-message "lazy-tmux daemon already running"'
bind-key f display-popup -B -E 'lazy-tmux picker'
bind-key C-s run-shell 'lazy-tmux save --all --scrollback && tmux display-message "All sessions saved successfully!"'

# sesh
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
