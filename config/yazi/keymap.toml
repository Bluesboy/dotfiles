[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "$SHELL" --block'
desc = "Open shell here"

[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "cd back to the root of the current Git repository"

[[mgr.prepend_keymap]]
on = [ "<C-s>" ]
run = 'shell tmux_term_pane.sh'
desc = "cd back to the root of the current Git repository"

[[mgr.prepend_keymap]]
on = [ "<S-t>" ]
run = 'plugin tmux-subpane'
desc = "cd back to the root of the current Git repository"

[[mgr.prepend_keymap]]
on = [ "m" ]
run = "plugin whoosh save_cwd"
desc = "Save current directory as a bookmark"

[[mgr.prepend_keymap]]
on = [ "'" ]
run = "plugin whoosh jump_by_key"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "d" ]
run = "plugin whoosh delete_by_key"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "f" ]
run = "plugin whoosh jump_by_fzf"
desc = "Jump to a bookmark by fzf"

[[mgr.prepend_keymap]]
on = [ "<Backspace>" ]
run = "hidden toggle"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on = [ "k" ]
run = "arrow -1"
desc = "Move cursor up"

[[mgr.prepend_keymap]]
on = [ "j" ]
run = "arrow 1"
desc = "Move cursor down"

[[mgr.prepend_keymap]]
on = [ "P", "s" ]
run = "plugin projects save"
desc = "Save current project"

[[mgr.prepend_keymap]]
on = [ "P", "l" ]
run = "plugin projects load"
desc = "Load project"

[[mgr.prepend_keymap]]
on = [ "P", "P" ]
run = "plugin projects load_last"
desc = "Load last project"

[[mgr.prepend_keymap]]
on = [ "P", "d" ]
run = "plugin projects delete"
desc = "Delete project"

[[mgr.prepend_keymap]]
on = [ "P", "D" ]
run = "plugin projects delete_all"
desc = "Delete all projects"

[[mgr.prepend_keymap]]
on = [ "P", "m" ]
run = "plugin projects 'merge current'"
desc = "Merge current tab to other projects"

[[mgr.prepend_keymap]]
on = [ "P", "M" ]
run = "plugin projects 'merge all'"
desc = "Merge current project to other projects"

[[mgr.prepend_keymap]]
on   = [ ">" ]
run  = "plugin what-size"
desc = "Calc size of selection or cwd"

[[mgr.prepend_keymap]]
on   = [ "g", "l" ]
run  = "plugin lazygit"
desc = "Run lazygit"

[[mgr.prepend_keymap]]
on   = [ "g", "b" ]
run  = "shell -- gh browse"
desc = "Browse on github"

[[mgr.prepend_keymap]]
on = [ "L" ]
run = "plugin bypass"
desc = "Recursively enter child directory, skipping children with only a single subdirectory"

[[mgr.prepend_keymap]]
on = [ "H" ]
run = "plugin bypass reverse"
desc = "Recursively enter parent directory, skipping parents with only a single subdirectory"

[[mgr.prepend_keymap]]
on = [ "l" ]
run = "plugin bypass smart-enter"
desc = "Open a file, or recursively enter child directory, skipping children with only a single subdirectory"

[[mgr.prepend_keymap]]
on   = [ "f","g" ]
run  = "plugin yafg"
desc = "find file by content (ctrl-t toggles ripgrep/fuzzy match)"

[[mgr.prepend_keymap]]
on   = [ "f","G" ]
run  = "search --via=rg"
desc = "find file by content (ripgrep match)"

[[mgr.prepend_keymap]]
on   = [ "f","f" ]
run  = "search --via=fd"
desc = "find file by filename"

[[mgr.prepend_keymap]]
on   = [ "F" ]
run  = "filter --smart"
desc = "find file by filename"

[[mgr.prepend_keymap]]
on   = [ "g", "B" ]
run  = "plugin open-git-remote"
desc = "Open git remote url"

[[mgr.prepend_keymap]]
on = [ "e", "t" ]
run = "plugin eza-preview"
desc = "Toggle tree/list dir preview"

[[mgr.prepend_keymap]]
on = [ "e", "-" ]
run = "plugin eza-preview inc-level"
desc = "Increment tree level"

[[mgr.prepend_keymap]]
on = [ "e", "_" ]
run = "plugin eza-preview dec"
desc = "Decrement tree level"

[[mgr.prepend_keymap]]
on = [ "e", "$" ]
run = "plugin eza-preview toggle-follow-symlinks"
desc = "Toggle tree follow symlinks"

[[mgr.prepend_keymap]]
on = [ "e", "*" ]
run = "plugin eza-preview toggle-hidden"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on = [ "e", "g", "i" ]
run = "plugin eza-preview toggle-git-ignore"
desc = "Toggle .gitignore files"

[[mgr.prepend_keymap]]
on = [ "e", "g", "s" ]
run = "plugin eza-preview toggle-git-status"
desc = "Toggle showing git status"
