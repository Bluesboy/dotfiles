[mgr]
ratio = [15, 40, 50 ]

[[plugin.prepend_previewers]]
url  = "*.tar*"
run  = 'piper --format=url -- tar tf "$1"'

[[plugin.prepend_previewers]]
url = "*/"
# run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"'
run = "eza-preview"

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[[plugin.prepend_previewers]]
mime = "application/bittorrent"
run  = 'piper -- transmission-show "$1"'

[[plugin.prepend_previewers]]
url  = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# Highlight text through bat, so previews match bat's Nord theme. The built-in
# code previewer reads the flavor's tmtheme.xml, which is broken in nord.yazi.
# Keep after the glow rule: the first matching previewer wins.
[[plugin.prepend_previewers]]
mime = "text/*"
run  = 'piper -- bat -p --color=always "$1"'

[[plugin.prepend_previewers]]
mime = "application/{json,ndjson,mbox,javascript,wine-extension-ini}"
run  = 'piper -- bat -p --color=always "$1"'

[[plugin.prepend_previewers]]
mime = "application/{,g}zip"
run  = "lsar"

[[plugin.prepend_previewers]]
mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}"
run  = "lsar"

[[plugin.prepend_spotters]]
url = "*"
run = "file-extra-metadata"

[tasks]
image_bound = [ 9000, 9000 ]

[preview]
cache_dir       = "~/.cache/yazi"
