#Do not add new line
add_newline = false
scan_timeout = 200

[directory]
fish_style_pwd_dir_length = 3

[line_break]
disabled = false

[character]
error_symbol = "[✖](bold red)"

[time]
disabled = true

[gcloud]
format = ' [$symbol$active]($style) '

[kubernetes]
disabled = false

[env_var.yazi_level]
description = "Indicate the shell was launched by `yazi`"
variable = "YAZI_LEVEL"
symbol = " "
format = '[$symbol]($style)'
