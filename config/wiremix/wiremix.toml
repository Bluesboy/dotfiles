# wiremix configuration, merged with the built-in defaults.
# Reference: https://github.com/tsowell/wiremix/blob/main/wiremix.toml

theme = "nord"
char_set = "solid"

# Only sample peaks of visible nodes, the mixer lives in a popup anyway
lazy_capture = true

# Monitor outputs share one GPU device; use individual node descriptions.
[[names.overrides]]
types = [ "endpoint" ]
matches = [
  { "node.name" = "alsa_output.pci-0000_01_00.1.pro-output-9" },
  { "node.name" = "alsa_output.pci-0000_01_00.1.pro-output-11" },
]
templates = [ "{node:node.description}" ]

# Nord, see https://www.nordtheme.com/docs/colors-and-palettes
[themes.nord]
default_device = { fg = "#a3be8c" }
default_stream = { fg = "#a3be8c" }
selector = { fg = "#d08770" }
tab = { fg = "#d8dee9" }
tab_selected = { fg = "#88c0d0", add_modifier = "BOLD" }
tab_marker = { fg = "#88c0d0" }
list_more = { fg = "#616e88" }
node_title = { fg = "#d8dee9" }
node_target = { fg = "#81a1c1" }
volume = { fg = "#d8dee9" }
volume_empty = { fg = "#4c566a" }
volume_filled = { fg = "#81a1c1" }
meter_inactive = { fg = "#4c566a" }
meter_active = { fg = "#a3be8c" }
meter_overload = { fg = "#bf616a" }
meter_center_inactive = { fg = "#4c566a" }
meter_center_active = { fg = "#a3be8c" }
config_device = { fg = "#d8dee9" }
config_profile = { fg = "#81a1c1" }
dropdown_icon = { fg = "#88c0d0" }
dropdown_border = { fg = "#5e81ac" }
dropdown_item = { fg = "#d8dee9" }
dropdown_selected = { fg = "#2e3440", bg = "#88c0d0" }
dropdown_more = { fg = "#616e88" }
help_border = { fg = "#5e81ac" }
help_item = { fg = "#d8dee9" }
help_more = { fg = "#616e88" }

# Default selector is shaded blocks, which are barely visible; use solid ones
[char_sets.solid]
selector_top = "▌"
selector_middle = "▌"
selector_bottom = "▌"
