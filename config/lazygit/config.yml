gui:
  language: en
  tabWidth: 2
  nerdFontsVersion: "3"
  showDivergenceFromBaseBranch: arrowAndNumber
  showCommandLog: false
git:
  disableForcePushing: true
  diffRenderers:
    - type: rawGit
      # Colored header, subject and body; git's format.pretty hides the body.
      args:
        - '--pretty=format:%C(yellow)commit %H%C(auto)%d%Creset%n%C(blue)Author: %an <%ae>%nDate:   %ad%Creset%n%n%C(bold green)%w(0,4,4)%s%w(0,0,0)%Creset%n%C(#f4dbd6)%w(0,4,4)%+b%w(0,0,0)%Creset'
      name: default
    - command: delta --dark --paging=never
    - type: extDiff
      command: difft --color=always --context={{diffContext}}
os:
  editPreset: nvim
customCommands:
  - key: '<c-g>'
    context: 'global'
    command: 'gh browse'
