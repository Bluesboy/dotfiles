#!/usr/bin/env ansible-playbook
---
- name: "Install and configure display"
  hosts: localhost
  vars:
    configs:
    - gammastep
    - niri
    - vicinae
    - xdg-desktop-portal

  tasks:
  # Graphics and Wayland

  - name: "Install Graphics drivers"
    community.general.pacman:
      name:
      - mesa # An open-source implementation of the OpenGL specification
      - vulkan-radeon # Radeon's Vulkan mesa driver
      - upower # Abstraction for enumerating power devices, listening to device events and querying history and statistics
      state: present
    become: true

  - name: "Install DDC/CI monitor control tools"
    community.general.pacman:
      name:
      - ddcutil # Query and control monitor settings using DDC/CI
      - ddcui # Graphical interface for DDC/CI monitor settings
      state: present
    become: true

  - name: "Enable I2C device access for DDC/CI"
    community.general.modprobe:
      name: i2c_dev
      state: present
      persistent: present
    become: true

  - name: "Install Wayland"
    community.general.pacman:
      name:
      - libva # Video Acceleration (VA) API for Linux
      - qt5-wayland # Provides APIs for Wayland
      - qt6-wayland # Provides APIs for Wayland
      - wayland # A computer display server protocol
      - wayland-protocols # Specifications of extended Wayland protocols
      - wl-clipboard # Command-line copy/paste utilities for Wayland
      - wlr-randr # Utility to manage outputs of a Wayland compositor
      - xclip # Command line interface to the X11 clipboard, for XWayland clients
      - xdg-desktop-portal-gnome # Backend implementation for xdg-desktop-portal for the GNOME desktop environment
      - xdg-desktop-portal-gtk # A backend implementation for xdg-desktop-portal using GTK
      - xdg-desktop-portal-hyprland # xdg-desktop-portal backend for hyprland
      - xdg-desktop-portal-wlr # xdg-desktop-portal backend for wlroots
      - xorg-xwayland # run X clients under wayland
      - xwayland-satellite # Xwayland outside your Wayland
      state: present
    become: true

  - name: "Install Niri"
    community.general.pacman:
      name:
      - niri # A scrollable-tiling Wayland compositor
      state: present
    become: true

  # Display manager

  - name: "Install Ly"
    community.general.pacman:
      name:
      - ly # TUI display manager
      state: present
    become: true

  - name: "Copy Ly configuration"
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/config/ly/config.ini"
      dest: "/etc/ly/config.ini"
      owner: root
      group: root
      mode: "0644"
    become: true

  - name: "Enable Ly"
    ansible.builtin.systemd:
      name: ly@tty2
      enabled: true
    become: true

  - name: "Create Ly service override directory"
    ansible.builtin.file:
      path: "/etc/systemd/system/ly@tty2.service.d"
      state: directory
      owner: root
      group: root
      mode: "0755"
    become: true

  - name: "Override Ly service to prevent screen flicker on shutdown"
    ansible.builtin.copy:
      dest: "/etc/systemd/system/ly@tty2.service.d/override.conf"
      content: |
        [Service]
        TTYReset=no
        TTYVHangup=no
        TTYVTDisallocate=yes
      owner: root
      group: root
      mode: "0644"
    become: true
    notify: "Reload systemd"

  # UI components

  - name: "Create the user unit directory"
    ansible.builtin.file:
      path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user"
      state: directory
      mode: "0755"
      owner: "{{ ansible_facts['user_uid'] }}"
      group: "{{ ansible_facts['user_gid'] }}"

  - name: "Install Vicinae"
    kewlfft.aur.aur:
      name:
      - vicinae-bin # A focused launcher for your desktop — native, fast, extensible
      use: "{{ aur_helper }}"
      state: present
    become: true
    become_user: "{{ aur_builder_user }}"

  - name: "Enable vicinae"
    ansible.builtin.systemd:
      name: vicinae
      state: started
      enabled: true
      scope: user

  # Color temperature

  - name: "Install gammastep"
    community.general.pacman:
      name:
      - gammastep # Adjusts the color temperature of your screen according to your surroundings.
      state: present
    become: true

  - name: "Enable gammastep"
    ansible.builtin.systemd:
      name: gammastep
      state: started
      enabled: true
      scope: user

  # Fonts

  - name: "Install Fonts"
    community.general.pacman:
      name:
      - noto-fonts # Google Noto TTF fonts
      - noto-fonts-emoji # Google Noto emoji fonts
      - noto-fonts-cjk # Google Noto CJK fonts
      - noto-fonts-extra # Google Noto TTF fonts - additional variants
      - ttf-ubuntu-mono-nerd # Patched font Ubuntu Mono from nerd fonts library
      - ttf-ubuntu-nerd # Patched font Ubuntu from nerd fonts library
      - ttf-dejavu-nerd # Patched font Dejavu Sans Mono from nerd fonts library
      - ttf-firacode-nerd # Patched font Fira (Fura) Code from nerd fonts library
      - ttf-nerd-fonts-symbols # High number of extra glyphs from popular 'iconic fonts'
      - ttf-nerd-fonts-symbols-common # High number of extra glyphs from popular 'iconic fonts' (common files)
      - ttf-nerd-fonts-symbols-mono # High number of extra glyphs from popular 'iconic fonts' (monospace)
      - ttf-noto-nerd # Patched font Noto from nerd fonts library
      - ttf-jetbrains-mono # Typeface for developers, by JetBrains
      - ttf-jetbrains-mono-nerd # Patched font JetBrains Mono from nerd fonts library
      - otf-firamono-nerd # Patched font Fira (Fura) Mono from nerd fonts library
      state: present
    become: true

  - name: "Install Nerd Fonts from AUR"
    kewlfft.aur.aur:
      name:
      - ttf-ubuntu-mono-ligaturized-git # Ubuntu Mono font with programming ligatures
      - ttf-ioskeley-mono-nerd # Ioskeley Mono Nerd Font (Hinted) - A patched version for standard screens
      use: "{{ aur_helper }}"
      state: present
    become: true
    become_user: "{{ aur_builder_user }}"

  # Misc

  - name: "Install FFmpegthumbnailer"
    community.general.pacman:
      name:
      - ffmpegthumbnailer # Lightweight video thumbnailer that can be used by file managers
      state: present
    become: true

  - name: "Enable GTK primary selection paste"
    community.general.dconf:
      key: /org/gnome/desktop/interface/gtk-enable-primary-paste
      value: "true"

  - name: "Symlink .gnupg configuration"
    ansible.builtin.file:
      src: "{{ playbook_dir }}/config/gnupg/gpg-agent.conf"
      dest: "{{ ansible_facts['user_dir'] }}/.gnupg/gpg-agent.conf"
      state: link
      owner: "{{ ansible_facts['user_uid'] }}"
      group: "{{ ansible_facts['user_gid'] }}"

  - name: "Create symlinks for configurations"
    ansible.builtin.file:
      src: "{{ playbook_dir }}/config/{{ item }}"
      dest: "{{ ansible_facts['user_dir'] }}/.config/{{ item }}"
      state: link
      owner: "{{ ansible_facts['user_uid'] }}"
      group: "{{ ansible_facts['user_gid'] }}"
    loop: "{{ configs }}"

  - name: "Symlink monitor settings user units"
    ansible.builtin.file:
      src: "{{ playbook_dir }}/config/systemd/user/{{ item }}"
      dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/{{ item }}"
      state: link
      owner: "{{ ansible_facts['user_uid'] }}"
      group: "{{ ansible_facts['user_gid'] }}"
    loop:
    - gammastep-asus.service
    - monitor-settings.service

  - name: "Enable monitor settings user services"
    ansible.builtin.systemd_service:
      name: "{{ item }}"
      enabled: true
      state: started
      scope: user
      daemon_reload: true
    loop:
    - gammastep-asus.service
    - monitor-settings.service

  # Noctalia is the graphical-session shell.
  - name: "Install Noctalia"
    community.general.pacman:
      name: noctalia
      state: present
    become: true

  - name: "Create the Noctalia user configuration directory"
    ansible.builtin.file:
      path: "{{ ansible_facts['user_dir'] }}/.config/noctalia"
      state: directory
      mode: "0755"

  - name: "Symlink Noctalia configuration"
    ansible.builtin.file:
      src: "{{ playbook_dir }}/config/noctalia/config.toml"
      dest: "{{ ansible_facts['user_dir'] }}/.config/noctalia/config.toml"
      state: link

  - name: "Symlink the Noctalia user unit"
    ansible.builtin.file:
      src: "{{ playbook_dir }}/config/systemd/user/noctalia.service"
      dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/noctalia.service"
      state: link

  - name: "Enable Noctalia for the graphical session"
    ansible.builtin.systemd_service:
      name: noctalia.service
      scope: user
      enabled: true
      state: started
      daemon_reload: true

  handlers:
  - name: "Reload systemd"
    ansible.builtin.systemd:
      daemon_reload: true
    become: true
